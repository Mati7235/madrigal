[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"

[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
