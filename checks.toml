# Check registry: each entry maps a name to its group.
# group is one of: offline | native | live | visual.
# The check <name> lives in crates/<crate>/tests/checks/check_<name>.rs
# and runs with `cargo test --test check_<name>`.
# Empty registry: `cargo xtask checks` reports "0 checks" and exits 0.

[[check]]
name = "core_models"
group = "offline"

