[package]
name = "madrigal-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-db = { path = "../madrigal-db" }
madrigal-library = { path = "../madrigal-library" }
madrigal-lyrics = { path = "../madrigal-lyrics" }
madrigal-settings = { path = "../madrigal-settings" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "check_ai_providers"
path = "tests/checks/check_ai_providers.rs"
