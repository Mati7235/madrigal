[package]
name = "madrigal-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "madrigal_app"
path = "src/lib.rs"

[[bin]]
name = "madrigal"
path = "src/main.rs"

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-db = { path = "../madrigal-db" }
madrigal-downloads = { path = "../madrigal-downloads" }
madrigal-i18n = { path = "../madrigal-i18n" }
madrigal-innertube = { path = "../madrigal-innertube" }
madrigal-library = { path = "../madrigal-library" }
madrigal-localmedia = { path = "../madrigal-localmedia" }
madrigal-lyrics = { path = "../madrigal-lyrics" }
madrigal-mpris = { path = "../madrigal-mpris" }
madrigal-net = { path = "../madrigal-net" }
madrigal-notify = { path = "../madrigal-notify" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-player = { path = "../madrigal-player" }
madrigal-scrobble = { path = "../madrigal-scrobble" }
madrigal-settings = { path = "../madrigal-settings" }
madrigal-streams = { path = "../madrigal-streams" }
madrigal-ui = { path = "../madrigal-ui" }
reqwest = { version = "0.12", features = ["blocking"] }
rusqlite = "0.41"
serde_json = "1"
slint = "=1.19.0"
tokio = { version = "1", features = ["rt"] }
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
madrigal-testkit = { path = "../madrigal-testkit" }
tempfile = "3"

[[test]]
name = "check_app_startup"
path = "tests/checks/check_app_startup.rs"

[[test]]
name = "check_app_shell"
path = "tests/checks/check_app_shell.rs"

[[test]]
name = "check_app_catalog"
path = "tests/checks/check_app_catalog.rs"

[[test]]
name = "check_app_cli"
path = "tests/checks/check_app_cli.rs"

[[test]]
name = "check_app_playback"
path = "tests/checks/check_app_playback.rs"

[[test]]
name = "check_app_lyrics"
path = "tests/checks/check_app_lyrics.rs"

[[test]]
name = "check_app_library"
path = "tests/checks/check_app_library.rs"

[[test]]
name = "check_app_downloads"
path = "tests/checks/check_app_downloads.rs"

[[test]]
name = "check_desktop"
path = "tests/checks/check_desktop.rs"

[[test]]
name = "check_app_streams"
path = "tests/checks/check_app_streams.rs"
