[package]
name = "madrigal-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-db = { path = "../madrigal-db" }
madrigal-files = { path = "../madrigal-files" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-settings = { path = "../madrigal-settings" }
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }

[[test]]
name = "check_backup_restore"
path = "tests/checks/check_backup_restore.rs"

[[test]]
name = "check_playlist_exchange"
path = "tests/checks/check_playlist_exchange.rs"

[[test]]
name = "check_backup_schedule"
path = "tests/checks/check_backup_schedule.rs"
