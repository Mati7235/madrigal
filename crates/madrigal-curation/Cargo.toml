[package]
name = "madrigal-curation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-files = { path = "../madrigal-files" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-settings = { path = "../madrigal-settings" }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "check_curation"
path = "tests/checks/check_curation.rs"
