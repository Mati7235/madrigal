[package]
name = "madrigal-innertube"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
madrigal-account = { path = "../madrigal-account" }
madrigal-core = { path = "../madrigal-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ytmapi-rs = { version = "=0.3.4", features = ["simplified-queries", "serde_json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "check_innertube_search"
path = "tests/checks/check_innertube_search.rs"

[[test]]
name = "check_innertube_home_library"
path = "tests/checks/check_innertube_home_library.rs"

[[test]]
name = "check_innertube_pages"
path = "tests/checks/check_innertube_pages.rs"

[[test]]
name = "check_innertube_discover"
path = "tests/checks/check_innertube_discover.rs"
