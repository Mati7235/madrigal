[package]
name = "madrigal-notify"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
futures-lite = "2"
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "check_notify_actions"
path = "tests/checks/check_notify_actions.rs"
