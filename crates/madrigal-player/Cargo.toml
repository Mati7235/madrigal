[package]
name = "madrigal-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-files = { path = "../madrigal-files" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-settings = { path = "../madrigal-settings" }
libmpv2 = "=6.0.1"
libmpv2-sys = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "check_player_queue"
path = "tests/checks/check_player_queue.rs"

[[test]]
name = "check_player_engine"
path = "tests/checks/check_player_engine.rs"

[[test]]
name = "check_player_session"
path = "tests/checks/check_player_session.rs"

# libmpv2-sys log capture needs one unsafe call: keep clippy, drop the workspace forbid.
[lints.clippy]
all = "warn"
