[package]
name = "madrigal-shazam"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-db = { path = "../madrigal-db" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-settings = { path = "../madrigal-settings" }
reqwest = { version = "0.12", features = ["blocking"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "check_shazam_signature"
path = "tests/checks/check_shazam_signature.rs"

[[test]]
name = "check_shazam_client"
path = "tests/checks/check_shazam_client.rs"
