[package]
name = "madrigal-sponsorblock"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-settings = { path = "../madrigal-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "check_sponsorblock"
path = "tests/checks/check_sponsorblock.rs"
