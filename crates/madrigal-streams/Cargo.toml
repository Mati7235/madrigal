[package]
name = "madrigal-streams"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
innertube-rs = "0.12"
madrigal-core = { path = "../madrigal-core" }
madrigal-files = { path = "../madrigal-files" }
madrigal-paths = { path = "../madrigal-paths" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "check_streams_orchestration"
path = "tests/checks/check_streams_orchestration.rs"

[[test]]
name = "check_streams_cache"
path = "tests/checks/check_streams_cache.rs"

[[test]]
name = "check_streams_po_token"
path = "tests/checks/check_streams_po_token.rs"

[[test]]
name = "check_streams_innertube"
path = "tests/checks/check_streams_innertube.rs"

[[test]]
name = "check_streams_live"
path = "tests/checks/check_streams_live.rs"
