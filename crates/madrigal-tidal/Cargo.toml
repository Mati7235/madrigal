[package]
name = "madrigal-tidal"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
madrigal-core = { path = "../madrigal-core" }
madrigal-files = { path = "../madrigal-files" }
madrigal-lyrics = { path = "../madrigal-lyrics" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-secrets = { path = "../madrigal-secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
regex = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "check_tidal_client"
path = "tests/checks/check_tidal_client.rs"
