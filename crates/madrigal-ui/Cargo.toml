[package]
name = "madrigal-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.clippy]
all = "warn"

[dependencies]
madrigal-artwork = { path = "../madrigal-artwork" }
madrigal-core = { path = "../madrigal-core" }
madrigal-db = { path = "../madrigal-db" }
madrigal-downloads = { path = "../madrigal-downloads" }
madrigal-i18n = { path = "../madrigal-i18n" }
madrigal-innertube = { path = "../madrigal-innertube" }
madrigal-library = { path = "../madrigal-library" }
madrigal-lyrics = { path = "../madrigal-lyrics" }
madrigal-paths = { path = "../madrigal-paths" }
madrigal-player = { path = "../madrigal-player" }
madrigal-settings = { path = "../madrigal-settings" }
crossbeam-channel = "0.5"
image = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = "1"
serde_json = "1"
slint = { version = "=1.19.0", features = ["mcp"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
madrigal-account = { path = "../madrigal-account" }
madrigal-artwork = { path = "../madrigal-artwork" }
madrigal-core = { path = "../madrigal-core" }
madrigal-i18n = { path = "../madrigal-i18n" }
madrigal-player = { path = "../madrigal-player" }
madrigal-settings = { path = "../madrigal-settings" }
madrigal-testkit = { path = "../madrigal-testkit" }
serde_json = "1"
tempfile = "3"

[build-dependencies]
slint-build = "=1.19.0"

[[test]]
name = "check_ui_foundations"
path = "tests/checks/check_ui_foundations.rs"

[[test]]
name = "check_ui_settings"
path = "tests/checks/check_ui_settings.rs"

[[test]]
name = "check_ui_shell"
path = "tests/checks/check_ui_shell.rs"

[[test]]
name = "check_ui_library"
path = "tests/checks/check_ui_library.rs"

[[test]]
name = "check_ui_player"
path = "tests/checks/check_ui_player.rs"

[[test]]
name = "check_ui_catalog"
path = "tests/checks/check_ui_catalog.rs"

[[test]]
name = "check_ui_actions"
path = "tests/checks/check_ui_actions.rs"

[[test]]
name = "check_artwork"
path = "tests/checks/check_artwork.rs"
