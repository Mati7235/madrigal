/* Madrigal component renditions, from crates/madrigal-ui/ui/components */
.md-root{font-family:var(--font-body);color:var(--on-surface);background:var(--surface);padding:var(--space-16);display:flex;flex-wrap:wrap;gap:var(--space-12);align-items:center}
.md-col{flex-direction:column;align-items:stretch}
.ic{display:inline-block;width:20px;height:20px;flex:none}
.ic-24{width:24px;height:24px}.ic-18{width:18px;height:18px}.ic-14{width:14px;height:14px}

.md-sl{position:relative;isolation:isolate}
.md-sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity 100ms ease-in-out;pointer-events:none;z-index:-0}
.md-sl:hover::after{opacity:var(--state-hover)}.md-sl:active::after{opacity:var(--state-pressed)}
.md-sl:focus-visible{outline:2px solid currentColor;outline-offset:-4px}
.md-btn{font:500 14px/20px var(--font-title);letter-spacing:.1px;height:40px;padding:0 16px;border-radius:var(--radius-medium);border:0;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:border-radius 150ms ease-in-out,background 100ms ease-in-out}
.md-btn:active{border-radius:var(--radius-small)}
.md-btn.m{height:56px;padding:0 24px;border-radius:var(--radius-large)}.md-btn.m:active{border-radius:var(--radius-medium)}
.md-btn.filled{background:var(--primary);color:var(--on-primary)}
.md-btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.md-btn.outlined{background:transparent;color:var(--on-surface-variant);box-shadow:inset 0 0 0 1px var(--outline-variant)}
.md-btn.text{background:transparent;color:var(--on-surface-variant)}
.md-btn.elevated{background:var(--surface-container-low);color:var(--primary);box-shadow:var(--shadow-card)}
.md-btn:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);box-shadow:none;cursor:default}
.md-icb{width:40px;height:40px;border-radius:20px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--on-surface-variant);transition:border-radius 150ms ease-in-out}
.md-icb.sel{border-radius:var(--radius-small)}
.md-icb.filled{background:var(--primary);color:var(--on-primary)}
.md-icb.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.md-icb.outlined{box-shadow:inset 0 0 0 1px var(--outline-variant)}
.md-chip{height:32px;padding:0 16px;border-radius:16px;display:inline-flex;align-items:center;gap:6px;font:500 14px/20px var(--font-title);letter-spacing:.1px;color:var(--on-surface);background:var(--surface-container-highest);border:0;cursor:pointer;transition:background 150ms cubic-bezier(0.2,0,0,1),color 150ms cubic-bezier(0.2,0,0,1),padding 200ms cubic-bezier(0.2,0,0,1),border-radius 200ms cubic-bezier(0.2,0,0,1)}
.md-chip.sel{background:var(--secondary);color:var(--on-secondary);padding-left:10px;border-radius:10px}
.md-chip:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--on-surface)}.md-chip.sel:focus-visible{box-shadow:inset 0 0 0 2px var(--on-secondary)}
.md-seg{display:inline-flex;height:40px;gap:2px}
.md-seg button{position:relative;border:0;background:var(--surface-container-highest);border-radius:8px;padding:0 16px;font:500 14px/20px var(--font-title);letter-spacing:.1px;color:var(--on-surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-radius 200ms cubic-bezier(0.2,0,0,1),background 150ms cubic-bezier(0.2,0,0,1),color 150ms cubic-bezier(0.2,0,0,1),padding 200ms cubic-bezier(0.2,0,0,1)}
.md-seg button:first-child{border-radius:20px 8px 8px 20px}
.md-seg button:last-child{border-radius:8px 20px 20px 8px}
.md-seg button.sel{border-radius:20px;background:var(--primary);color:var(--on-primary);padding:0 18px 0 14px}
.md-seg button.sel::before{content:"";width:14px;height:14px;flex:none;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M20 6 9 17l-5-5%27/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27black%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M20 6 9 17l-5-5%27/%3E%3C/svg%3E") center/contain no-repeat}
.md-seg button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--on-surface)}
.md-seg button.sel:focus-visible{box-shadow:inset 0 0 0 2px var(--on-primary)}
@media (prefers-reduced-motion: reduce){.md-seg button{transition:none}}
.md-sw{width:52px;height:32px;border-radius:16px;background:var(--surface-container-highest);box-shadow:inset 0 0 0 2px var(--outline);position:relative;border:0;cursor:pointer;flex:none}
.md-sw::before{content:"";position:absolute;width:16px;height:16px;border-radius:8px;left:8px;top:8px;background:var(--outline);transition:all 200ms ease-in-out}
.md-sw.on{background:var(--primary);box-shadow:none}.md-sw.on::before{width:24px;height:24px;border-radius:12px;left:24px;top:4px;background:var(--on-primary)}
.md-cb{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;color:var(--on-surface)}
.md-cb i{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 2px var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center;color:var(--on-primary)}
.md-cb.on i{background:var(--primary);box-shadow:none}
.md-slider{position:relative;height:44px;width:320px;display:flex;align-items:center;gap:6px}
.md-slider .a{height:16px;border-radius:8px 2px 2px 8px;background:var(--primary)}
.md-slider .h{width:4px;height:44px;border-radius:2px;background:var(--primary);flex:none}
.md-slider .b{flex:1;height:16px;border-radius:2px 8px 8px 2px;background:var(--secondary-container)}
.md-tf{width:320px}
.md-tf .box{height:56px;border-radius:var(--radius-extra-small);box-shadow:inset 0 0 0 1px var(--outline);padding:0 16px;display:flex;flex-direction:column;justify-content:center}
.md-tf.focus .box{box-shadow:inset 0 0 0 2px var(--primary)}
.md-tf .lab{font:400 12px/16px var(--font-body);letter-spacing:.4px;color:var(--on-surface-variant)}.md-tf.focus .lab{color:var(--primary)}
.md-tf .val{font:400 16px/24px var(--font-body);letter-spacing:.5px;color:var(--on-surface)}
.md-tf .sup{font:400 12px/16px var(--font-body);letter-spacing:.4px;color:var(--on-surface-variant);padding:4px 16px 0}
.md-search{height:52px;width:420px;border-radius:26px;background:var(--surface-container-high);display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;color:var(--on-surface-variant);font:400 16px/24px var(--font-body);letter-spacing:.5px}
.md-search.focus{box-shadow:inset 0 0 0 2px var(--primary)}.md-search span{flex:1}
.md-card{width:150px;height:190px;border-radius:var(--radius-medium);background:var(--surface-container);padding:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:box-shadow 200ms ease-out}
.md-card.lit{box-shadow:var(--shadow-card)}.md-card.lit:hover{box-shadow:var(--shadow-card-hover)}
.md-card .art{position:relative;height:118px;border-radius:var(--radius-small);background:var(--surface-container-high);display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);margin-bottom:4px}
.md-card .t{font:600 13px/18px var(--font-title);color:var(--on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-card .s{font:500 11px/16px var(--font-body);letter-spacing:.5px;color:var(--on-surface-variant)}
.md-card:hover::after{opacity:var(--state-media-hover)}
.md-card .pl{position:absolute;right:8px;bottom:8px;z-index:1;width:44px;height:44px;border-radius:var(--radius-large);background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);opacity:0;transform:translateY(6px);transition:opacity 150ms cubic-bezier(0.2,0,0,1),transform 200ms cubic-bezier(0.2,0,0,1),border-radius 200ms cubic-bezier(0.2,0,0,1)}
.md-card:hover .pl,.md-card:focus-within .pl,.md-card.hov .pl{opacity:1;transform:none}
.md-card .pl:hover{border-radius:22px}
.md-row{height:54px;border-radius:var(--radius-small);display:flex;align-items:center;gap:12px;padding:0 8px;width:560px;box-sizing:border-box;color:var(--on-surface)}
.md-row:hover,.md-row.hov{background:var(--surface-container)}
.md-row>.md-icb{opacity:0;transition:opacity 100ms}.md-row:hover>.md-icb,.md-row:focus-within>.md-icb,.md-row.hov>.md-icb,.md-row.active>.md-icb{opacity:1}
.md-row.active{background:var(--primary-container)}
.md-row .cv{width:36px;height:36px;border-radius:var(--radius-extra-small);background:var(--surface-container-high);display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);flex:none}
.md-row .tx{flex:1;min-width:0}
.md-row .t{font:500 14px/20px var(--font-title);letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-row.active .t{color:var(--primary)}
.md-row .s,.md-row .d{font:500 11px/16px var(--font-body);letter-spacing:.5px;color:var(--on-surface-variant)}
.md-row .pg{width:120px;height:6px;border-radius:3px;background:var(--surface-variant);overflow:hidden}.md-row .pg i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.md-menu{width:304px;border-radius:var(--radius-large-increased);background:var(--surface-container-high);box-shadow:var(--shadow-menu);padding:8px;box-sizing:border-box;color:var(--on-surface)}
.md-menu .hd{display:flex;align-items:center;gap:12px;padding:8px 12px 12px}
.md-menu .hd .cv{width:40px;height:40px;border-radius:var(--radius-small);background:var(--surface-container-highest);display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant);flex:none}
.md-menu .hd span{display:flex;flex-direction:column;min-width:0}
.md-menu .hd b{font:500 16px/24px var(--font-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.md-menu .hd small{font:400 13px/18px var(--font-body);color:var(--on-surface-variant)}
.md-menu hr{border:0;height:1px;background:var(--outline-variant);margin:4px 12px}
.md-menu .r{position:relative;min-height:48px;border-radius:var(--radius-medium);display:flex;align-items:center;gap:12px;padding:0 16px 0 12px;font:400 16px/24px var(--font-body);letter-spacing:.15px;color:var(--on-surface)}
.md-menu .r .ic{color:var(--on-surface-variant)}
.md-menu .r span{flex:1}
.md-menu .r:hover,.md-menu .r.hov{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.md-menu .r.kb,.md-menu .r:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--on-surface)}

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const EQ = '<span class="eqb" aria-label="Playing"><i></i><i></i><i></i></span>';
  const TINTS = ['primary', 'tertiary', 'secondary', 'primary-fixed-dim', 'tertiary-fixed-dim', 'secondary-fixed-dim'];

  const ALBUMS = [
    { id: 'kob', t: 'Kind of Blue', a: 'Miles Davis', y: 1959, tracks: [['So What', 562], ['Freddie Freeloader', 586], ['Blue in Green', 337], ['All Blues', 693], ['Flamenco Sketches', 566]] },
    { id: 'als', t: 'A Love Supreme', a: 'John Coltrane', y: 1965, tracks: [['Acknowledgement', 463], ['Resolution', 440], ['Pursuance', 642], ['Psalm', 422]] },
    { id: 'to', t: 'Time Out', a: 'The Dave Brubeck Quartet', y: 1959, tracks: [['Blue Rondo à la Turk', 404], ['Strange Meadow Lark', 442], ['Take Five', 324], ['Three to Get Ready', 324], ['Kathy’s Waltz', 289]] },
    { id: 'sne', t: 'Speak No Evil', a: 'Wayne Shorter', y: 1966, tracks: [['Witch Hunt', 489], ['Fee-Fi-Fo-Fum', 362], ['Dance Cadaverous', 405], ['Speak No Evil', 501], ['Infant Eyes', 412]] },
    { id: 'mau', t: 'Mingus Ah Um', a: 'Charles Mingus', y: 1959, tracks: [['Better Git It in Your Soul', 443], ['Goodbye Pork Pie Hat', 344], ['Boogie Stop Shuffle', 222], ['Fables of Faubus', 492]] },
    { id: 'mv', t: 'Maiden Voyage', a: 'Herbie Hancock', y: 1965, tracks: [['Maiden Voyage', 475], ['The Eye of the Hurricane', 360], ['Little One', 523], ['Survival of the Fittest', 600], ['Dolphin Dance', 557]] },
    { id: 'gs', t: 'Giant Steps', a: 'John Coltrane', y: 1960, tracks: [['Giant Steps', 286], ['Cousin Mary', 345], ['Countdown', 141], ['Naima', 261], ['Mr. P.C.', 417]] },
    { id: 'mw', t: 'Moanin’', a: 'Art Blakey & The Jazz Messengers', y: 1958, tracks: [['Moanin’', 575], ['Are You Real', 288], ['Along Came Betty', 371], ['Blues March', 377]] },
  ];
  const TRACKS = [];
  ALBUMS.forEach((al, ai) => { al.tint = TINTS[ai % TINTS.length]; al.tracks.forEach((tr, i) => TRACKS.push({ id: al.id + i, t: tr[0], d: tr[1], al, n: i + 1 })); });
  const byId = (id) => TRACKS.find((x) => x.id === id);
  const LYR = ['The city hums a lower key', 'Street lamps keep the time for me', 'Every window, one more chord', 'Played for no one, played for you', 'Let the bassline walk me home', 'Brass and rain on the same street', 'Hold the note a little longer', 'Morning waits behind the drums', 'Count it in and let it go', 'One more chorus, then the door'];
  const LYR_ES = ['La ciudad zumba en un tono más grave', 'Los faroles marcan el compás', 'Cada ventana, un acorde más', 'Tocado para nadie, tocado para vos', 'Que el bajo me acompañe a casa', 'Metales y lluvia en la misma calle', 'Sostené la nota un poco más', 'La mañana espera detrás de la batería', 'Contá y dejalo ir', 'Un coro más y después la puerta'];

  const S = {
    page: 'home', detail: null, queue: ALBUMS[0].tracks.map((_, i) => 'kob' + i), cur: 2, playing: false, pos: 151,
    liked: new Set(['kob2', 'gs3', 'to2']), theme: 'system', black: false, bg: 'Theme', full: false, fullTab: 'lyrics', qOpen: false,
    query: '', filter: 'All', source: 'Online', libSel: new Set(), dl: [
      { al: 'kob', st: 'done', p: 1 }, { al: 'als', st: 'dl', p: 0.42, sp: 2.4 }, { al: 'to', st: 'queued', p: 0 }, { al: 'mau', st: 'paused', p: 0.22 }, { al: 'sne', st: 'err', p: 0.4 }],
    lyrSize: 22, sleep: null, tag: 'All', shuffle: false, repeat: 0, vol: 70, lyrOffset: 300,
  };
  const cur = () => byId(S.queue[S.cur]);

  function art(al, size = '', glyph = 'music-2') {
    return `<span class="art ${size}" style="--tint:var(--${al.tint})">${ic(glyph)}</span>`;
  }
  function row(tr, opts = {}) {
    const playing = cur() && cur().id === tr.id;
    const sel = opts.sel && S.libSel.has(tr.id);
    return `<div class="trow${playing ? ' active' : ''}${sel ? ' selected' : ''}" data-play="${tr.id}" tabindex="0" role="button" aria-label="Play ${esc(tr.t)}">
      ${opts.sel ? `<button class="md-cb${sel ? ' on' : ''}" data-sel="${tr.id}" role="checkbox" aria-checked="${sel}" aria-label="Select ${esc(tr.t)}"><i>${sel ? ic('check', 'ic-14') : ''}</i></button>` : ''}
      ${opts.num ? `<span class="num">${playing ? EQ : tr.n}</span>` : art(tr.al, 'xs')}
      ${!opts.num && playing ? EQ : ''}
      <span class="tx"><b>${esc(tr.t)}</b><span>${esc(tr.al.a)}${opts.num ? '' : ' · ' + esc(tr.al.t)}</span></span>
      <span class="dur">${fmt(tr.d)}</span>
      <button class="md-icb md-sl" data-menu="${tr.id}" aria-label="More actions for ${esc(tr.t)}">${ic('ellipsis-vertical')}</button></div>`;
  }
  function card(al, artist) {
    return `<div class="acard md-sl${artist ? ' artist' : ''}" data-album="${al.id}" role="button" tabindex="0" aria-label="Open ${esc(al.t)}"><span class="aw">${art(al, '', artist ? 'user-round' : 'music-2')}${artist ? '' : `<button class="apl" data-playalbum="${al.id}" aria-label="Play ${esc(al.t)}">${ic('play')}</button>`}</span><b>${esc(artist ? al.a : al.t)}</b><span>${artist ? 'Artist' : esc(al.a)}</span></div>`;
  }
  const sh = (t, extra = '') => `<div class="sh"><h2>${t}</h2>${extra}</div>`;

  const PAGES = {
    home() {
      const c = cur();
      const h = new Date().getHours();
      const greet = h < 12 ? 'Good morning' : h < 19 ? 'Good afternoon' : 'Good evening';
      return `<h1>${greet}</h1>
      <section class="hero">
        <div class="big" style="--tint:var(--${c.al.tint})"><small>Continue listening</small><div><b>${esc(c.al.t)}</b><span>${esc(c.al.a)} · ${S.cur + 1} of ${S.queue.length}</span></div>
          ${art(c.al, 'hart')}<button class="hplay" data-toggle aria-label="${S.playing ? 'Pause' : 'Play'}">${ic(S.playing ? 'pause' : 'play')}</button></div>
        <div class="side"><button class="a" data-go="library">${ic('heart')}Liked songs</button><button class="b" data-go="downloads">${ic('download')}Downloads</button><button class="c" data-go="library">${ic('history')}History</button><button class="d" data-go="explore">${ic('compass')}Discover</button></div>
      </section>
      <section>${sh('Quick picks')}<div class="qp">${['gs3', 'to2', 'mw0', 'mv0', 'sne4', 'mau1'].map((id) => row(byId(id))).join('')}</div></section>
      <section>${sh('Albums for tonight')}<div class="rail">${ALBUMS.map((a) => card(a)).join('')}</div></section>`;
    },
    search() {
      const q = S.query.trim().toLowerCase();
      const songs = TRACKS.filter((t) => !q || (t.t + ' ' + t.al.a + ' ' + t.al.t).toLowerCase().includes(q));
      const albums = ALBUMS.filter((a) => !q || (a.t + ' ' + a.a).toLowerCase().includes(q));
      const top = songs[0];
      const chips = ['All', 'Songs', 'Albums', 'Artists'].map((f) => `<button class="md-chip md-sl${S.filter === f ? ' sel' : ''}" data-filter="${f}">${S.filter === f ? ic('check', 'ic-14') : ''}${f}</button>`).join('');
      let body = '';
      if (!songs.length && !albums.length) {
        body = `<div class="empty"><div class="blob">${ic('search')}</div><h3>No results for “${esc(S.query)}”</h3><p>Check the spelling or try an artist or album name.</p></div>`;
      } else {
        if (S.filter === 'All' && top) body += `<div class="row2"><div class="toprs">${art(top.al, 'md')}<div><b>${esc(top.t)}</b><span>Song · ${esc(top.al.a)}</span></div><div class="acts"><button class="md-btn filled md-sl" data-play="${top.id}">${ic('play', 'ic-18')}Play</button><button class="md-btn tonal md-sl" data-album="${top.al.id}">Album</button></div></div><div class="list">${sh('Songs')}${songs.slice(0, 4).map((t) => row(t)).join('')}</div></div>`;
        if (S.filter === 'Songs') body += `<div class="list">${songs.slice(0, 12).map((t) => row(t)).join('')}</div>`;
        if (S.filter === 'All' || S.filter === 'Albums') body += `<section>${sh('Albums')}<div class="rail">${albums.map((a) => card(a)).join('')}</div></section>`;

  function renderLyrics(force) {
    const p = $('#fpanel');

        p.innerHTML = `<dl class="info"><dt>Title</dt><dd>${esc(c.t)}</dd><dt>Album</dt><dd>${esc(c.al.t)} (${c.al.y})</dd><dt>Source</dt><dd>YouTube Music · stream</dd><dt>Codec</dt><dd>opus · 160 kbps · 48 kHz</dd><dt>Route</dt><dd>Cache</dd><dt>Loudness</dt><dd>−8.2 LUFS</dd><dt>Buffer</dt><dd><span class="buf"><i></i></span>72%</dd></dl>`;

    if (S.fullTab === 'queue') {

        const rest = S.queue.slice(S.cur + 1);
        p.innerHTML = rest.length ? `<div class="fq">${rest.map((id, k) => { const t = byId(id); return `<div class="fqr" data-jump="${S.cur + 1 + k}" tabindex="0" role="button">${art(t.al, 'xs')}<span class="tx"><b>${esc(t.t)}</b><span>${esc(t.al.a)}</span></span><span class="d">${fmt(t.d)}</span><button class="md-icb md-sl" data-qrm="${S.cur + 1 + k}" aria-label="Remove ${esc(t.t)}">${ic('x', 'ic-18')}</button></div>`; }).join('')}</div>` : `<p class="fempty">Nothing queued after this song.</p>`;
      }
      return;

    const t = S.pos + S.lyrOffset / 1000;
    const line = Math.floor(t / 6) % LYR.length;

    if (force || line !== lastLine) {
      lastLine = line;
      p.style.setProperty('--lsize', S.lyrSize + 'px');
      const off = (S.lyrOffset >= 0 ? '+' : '−') + Math.abs(S.lyrOffset / 1000).toFixed(1) + ' s';
      p.innerHTML = `<div class="lhd"><span class="syn">${ic('check', 'ic-14')}Synced</span><span class="grow"></span>
        <button class="md-icb md-sl" data-off="-100" aria-label="Lyrics earlier by 0.1 seconds">${ic('minus', 'ic-18')}</button><span class="offv" aria-live="polite">${off}</span><button class="md-icb md-sl" data-off="100" aria-label="Lyrics later by 0.1 seconds">${ic('plus', 'ic-18')}</button></div>
        <div class="lyr3">${[-2, -1, 0, 1, 2, 3].map((o) => { const i = (line + o + LYR.length) % LYR.length;
          if (o === 0) return `<div class="on" data-seekline="0"><span class="lw" id="lw">${lyricWords(i).map((w) => `<span>${w}</span>`).join(' ')}</span><small>${LYR_ES[i]}</small></div>`;
          return `<div class="${o < 0 ? 'past' : ''} d${Math.abs(o)}" data-seekline="${o}">${LYR[i]}</div>`; }).join('')}</div>`;
    }
    const lw = $('#lw');
    if (lw) {
      const ws = lw.children, n = ws.length, x = within * n;
      for (let k = 0; k < n; k++) { const sp = ws[k]; const v = Math.max(0, Math.min(1, x - k)); sp.style.setProperty('--w', (v * 100).toFixed(0) + '%'); sp.className = v >= 1 ? 'sung' : v > 0 ? 'now' : ''; }
    }
  }
  function render() { renderNav(); renderPage(); renderBar(); renderQueue(); renderFull(); }

  function tick(onlyUi) {
    const c = cur();
    const f = Math.min(1, S.pos / c.d);
    const sfl = $('#sfl'), shd = $('#shd'), pgl = $('#pgl');
    const swv = $('#swv'); if (swv) swv.style.width = `calc((100% - 16px) * ${f})`;
    if (sfl) { sfl.style.width = `calc((100% - 16px) * ${f})`; shd.style.left = `calc(8px + (100% - 16px) * ${f} - 2px)`; }
    if (pgl) pgl.style.width = (f * 100) + '%';
    const tp = $('#tpos'); if (tp) tp.textContent = fmt(S.pos);
    const fp = $('#fpos'); if (fp) fp.textContent = fmt(S.pos);
    const fr = $('#frem'); if (fr) fr.textContent = fmt(c.d - S.pos);
    const fs = $('#fseek'); if (fs) fs.style.setProperty('--f', f);
    const sk = $('#seek'); if (sk) sk.setAttribute('aria-valuenow', Math.floor(S.pos));
    if (!onlyUi) renderLyrics(false);
  }
  setInterval(() => {
    let dirty = false;
    if (S.playing) {
      S.pos += 0.25;
      if (S.pos >= cur().d) { next(); return; }
      tick(false);
    }
    S.dl.forEach((d) => { if (d.st === 'dl') { d.p = Math.min(1, d.p + 0.004); if (d.p >= 1) { d.st = 'done'; snack('Download finished · ' + ALBUMS.find((a) => a.id === d.al).t, 'Open', 'circle-check'); dirty = true; } } });
    if (S.page === 'downloads' && !S.detail) { $$('.dlr').forEach((r, i) => { const d = S.dl[i]; if (d && d.st === 'dl') { r.querySelector('.pg i').style.width = Math.round(d.p * 100) + '%'; } }); }
    if (dirty && S.page === 'downloads') renderPage();
  }, 250);

  function play(id, list) {
    if (list) { S.queue = list; S.cur = list.indexOf(id); }
    else { const k = S.queue.indexOf(id); if (k >= 0) S.cur = k; else { S.queue.splice(S.cur + 1, 0, id); S.cur += 1; } }
    S.pos = 0; S.playing = true; lastLine = -1; render();
  }
  function next() { if (S.cur < S.queue.length - 1) { S.cur++; S.pos = 0; } else { S.playing = false; S.pos = 0; } lastLine = -1; render(); }
  function prev() { if (S.pos > 3 || S.cur === 0) S.pos = 0; else { S.cur--; S.pos = 0; } lastLine = -1; render(); }

  let snackTimer, snackUndo;
  function snack(text, action, icon, undo) {
    const el = $('#snack');
    clearTimeout(snackTimer);
    snackUndo = undo || null;
    el.innerHTML = `<div class="snk" role="status">${ic(icon || 'circle-check')}<span class="tx">${esc(text)}</span>${action ? `<button class="act" data-snackact>${esc(action)}</button>` : ''}<button class="x" data-snackx aria-label="Dismiss">${ic('x', 'ic-18')}</button></div>`;
    el.hidden = false;
    snackTimer = setTimeout(() => { el.hidden = true; }, action ? 8000 : 4000);
  }

  function openMenu(id, x, y) {
    const t = byId(id);
    const m = $('#tmenu');
    const liked = S.liked.has(id);
    const it = ([k, i, l, cls]) => `<button class="r${cls || ''}" data-mact="${k}:${id}" role="menuitem">${ic(i)}<span>${l}</span></button>`;
    m.innerHTML = `<div class="hd">${art(t.al, 'xs')}<span><b>${esc(t.t)}</b><small>${esc(t.al.a)} · ${esc(t.al.t)}</small></span></div><hr>
      ${[['next', 'list-plus', 'Play next'], ['queue', 'list-music', 'Add to queue'], ['like', liked ? 'heart-filled' : 'heart', liked ? 'Liked' : 'Like', liked ? ' on' : ''], ['dl', 'download', 'Download']].map(it).join('')}<hr>${it(['album', 'library', 'Go to album'])}`;
    m.hidden = false;
    const r = m.getBoundingClientRect();
    const W = window.innerWidth, H = window.innerHeight;
    m.style.left = Math.max(8, Math.min(x, W - r.width - 8)) + 'px';
    m.style.top = (y + r.height > H - 104 ? Math.max(8, y - r.height) : y) + 'px';
    $('#scrim').hidden = false;
    m.querySelector('.r').focus();
  }
  function closeMenu() { $('#tmenu').hidden = true; $('#scrim').hidden = true; }

  function applyTheme() {
    const sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const host = document.documentElement.getAttribute('data-theme');
    let mode = S.theme === 'system' ? (host || (sys ? 'dark' : 'light')) : S.theme;
    if (mode === 'dark' && S.black) mode = 'black';
    $('#app').setAttribute('data-m', mode);
  }
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function sleepDialog() {
    const d = $('#dialog');
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><span class="ico">${ic('clock')}</span><h3 id="dlgt">Sleep timer</h3><p>Playback pauses after the time you pick.</p>
      <div class="opts">${['15 min', '30 min', '45 min', '60 min', 'End of track'].map((m) => `<button class="md-chip md-sl${S.sleep === m ? ' sel' : ''}" data-sleepopt="${m}">${S.sleep === m ? ic('check', 'ic-14') : ''}${m}</button>`).join('')}</div>
      <div class="acts"><button class="md-btn text md-sl" data-dlgclose>Cancel</button><button class="md-btn filled md-sl" data-dlgok>Start</button></div></div>`;
    d.hidden = false;
    d.querySelector('button').focus();
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a, [data-play], [data-jump], [data-seekline], [data-album]');
    if (!e.target.closest('.dd')) $$('.dd.open').forEach((d) => { d.classList.remove('open'); d.querySelector('.trig').setAttribute('aria-expanded', 'false'); });
    if (e.target.id === 'scrim') { closeMenu(); return; }
    if (e.target.id === 'dialog') { $('#dialog').hidden = true; return; }
    if (!t) return;
    const ds = t.dataset;
    if (t.tagName === 'A') e.preventDefault();
    if (ds.go) { S.page = ds.go; S.detail = null; S.full = false; render(); $('#main').scrollTop = 0; return; }
    if (ds.menu !== undefined) { e.stopPropagation(); const r = t.getBoundingClientRect(); openMenu(ds.menu, r.left - 260, r.bottom + 4); return; }
    if (ds.sel) { e.stopPropagation(); S.libSel.has(ds.sel) ? S.libSel.delete(ds.sel) : S.libSel.add(ds.sel); renderPage(); return; }
    if (ds.mact) { const [k, id] = ds.mact.split(':'); const tr = byId(id); closeMenu();
      if (k === 'next') { const prevQ = S.queue.slice(); S.queue.splice(S.cur + 1, 0, id); renderQueue(); snack(`${tr.t} plays next`, 'Undo', 'list-plus', () => { S.queue = prevQ; renderQueue(); }); }
      if (k === 'queue') { const prevQ = S.queue.slice(); S.queue.push(id); renderQueue(); snack('Added to queue', 'Undo', 'list-music', () => { S.queue = prevQ; renderQueue(); }); }
      if (k === 'like') { const had = S.liked.has(id); had ? S.liked.delete(id) : S.liked.add(id); render(); snack(had ? 'Removed from Liked songs' : 'Saved to Liked songs', 'Undo', had ? 'heart' : 'heart-filled', () => { had ? S.liked.add(id) : S.liked.delete(id); render(); }); }
      if (k === 'dl') { S.dl.unshift({ al: tr.al.id, st: 'dl', p: 0, sp: 3.1 }); snack(`Downloading ${tr.t}`, 'Open', 'download', () => { S.page = 'downloads'; S.detail = null; S.full = false; render(); }); }
      if (k === 'album') { S.detail = tr.al.id; S.full = false; render(); }
      return; }
    if (ds.snackact !== undefined) { $('#snack').hidden = true; if (snackUndo) snackUndo(); return; }
    if (ds.snackx !== undefined) { $('#snack').hidden = true; return; }
    if (ds.snack) { const [txt, act] = ds.snack.split('|'); snack(txt, act); return; }
    if (ds.bulk) { snack(ds.bulk, 'Undo', 'circle-check'); S.libSel.clear(); renderPage(); return; }
    if (ds.clearsel !== undefined) { S.libSel.clear(); renderPage(); return; }
    if (ds.toggle !== undefined) { S.playing = !S.playing; render(); return; }
    if (ds.next !== undefined) { next(); return; }
    if (ds.prev !== undefined) { prev(); return; }
    if (ds.like) { const had = S.liked.has(ds.like); had ? S.liked.delete(ds.like) : S.liked.add(ds.like); render(); snack(had ? 'Removed from Liked songs' : 'Saved to Liked songs', 'Undo', had ? 'heart' : 'heart-filled', () => { had ? S.liked.add(ds.like) : S.liked.delete(ds.like); render(); }); return; }
    if (ds.queue !== undefined) { S.qOpen = !S.qOpen; renderBar(); renderQueue(); return; }
    if (ds.full !== undefined) { S.full = !S.full; if (S.full) S.qOpen = false; render(); return; }
    if (ds.ftab) { S.fullTab = ds.ftab; renderFull(); return; }
    if (ds.shuf !== undefined) { S.shuffle = !S.shuffle; renderFull(); snack(S.shuffle ? 'Shuffle on' : 'Shuffle off', '', 'shuffle'); return; }
    if (ds.rep !== undefined) { S.repeat = (S.repeat + 1) % 3; renderFull(); snack(['Repeat off', 'Repeat all', 'Repeat one'][S.repeat], '', S.repeat === 2 ? 'repeat-1' : 'repeat'); return; }
    if (ds.mute !== undefined) { S.vol = S.vol ? 0 : 70; renderFull(); return; }
    if (ds.off) { S.lyrOffset += Number(ds.off); lastLine = -1; renderLyrics(true); return; }
    if (ds.seekline !== undefined) { S.pos = Math.max(0, S.pos + Number(ds.seekline) * 6); lastLine = -1; tick(false); return; }
    if (ds.qrm) { S.queue.splice(Number(ds.qrm), 1); renderQueue(); return; }
    if (ds.jump) { S.cur = Number(ds.jump); S.pos = 0; S.playing = true; render(); return; }
    if (ds.album) { S.detail = ds.album; S.full = false; render(); $('#main').scrollTop = 0; return; }
    if (ds.back !== undefined) { S.detail = null; render(); return; }
    if (ds.playalbum) { e.stopPropagation(); const ids = TRACKS.filter((x) => x.al.id === ds.playalbum).map((x) => x.id); if (ds.shuffle !== undefined) ids.sort(() => Math.random() - 0.5); play(ids[0], ids); return; }
    if (ds.play) { if (e.target.closest('.md-cb')) return; play(ds.play); return; }
    if (ds.filter) { S.filter = ds.filter; renderPage(); return; }
    if (ds.source) { S.source = ds.source; renderPage(); return; }
    if (ds.tag) { S.tag = ds.tag; renderPage(); return; }
    if (ds.clearq !== undefined) { S.query = ''; renderPage(); $('#q').focus(); return; }
    if (ds.mood) { S.page = 'search'; S.query = ''; S.filter = 'All'; render(); snack(`${ds.mood} playlists load here from YouTube Music`, '', 'compass'); return; }
    if (ds.themeSet) { S.theme = ds.themeSet; applyTheme(); renderPage(); return; }
    if (ds.black !== undefined) { S.black = !S.black; applyTheme(); renderPage(); return; }
    if (t.classList.contains('trig')) { const d = t.closest('.dd'); const o = !d.classList.contains('open'); d.classList.toggle('open', o); t.setAttribute('aria-expanded', String(o)); return; }
    if (ds.bg) { S.bg = ds.bg; renderPage(); snack(`Player background: ${ds.bg}`, 'Preview', 'sliders-horizontal', () => { S.full = true; render(); }); return; }
    if (ds.group) { if (ds.group !== 'Appearance') snack(`${ds.group} is not part of this prototype`, ''); return; }
    if (ds.dl) { const [k, i] = ds.dl.split(':'); const d = S.dl[Number(i)];
      if (k === 'pause') d.st = 'paused'; if (k === 'resume') d.st = 'dl'; if (k === 'retry') { d.st = 'dl'; d.sp = 1.8; } if (k === 'cancel') S.dl.splice(Number(i), 1);
      renderPage(); return; }
    if (ds.pauseall !== undefined) { S.dl.forEach((d) => { if (d.st === 'dl' || d.st === 'queued') d.st = 'paused'; }); renderPage(); return; }
    if (ds.clearfin !== undefined) { S.dl = S.dl.filter((d) => d.st !== 'done'); renderPage(); return; }
    if (ds.sleep !== undefined) { sleepDialog(); return; }
    if (ds.sleepopt) { S.sleep = ds.sleepopt; sleepDialog(); return; }
    if (ds.dlgclose !== undefined) { $('#dialog').hidden = true; return; }
    if (ds.dlgok !== undefined) { $('#dialog').hidden = true; if (S.sleep) snack(`Sleep timer set: ${S.sleep}`, 'Cancel', 'clock', () => { S.sleep = null; }); return; }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') { S.query = e.target.value; renderPage(); }
    if (e.target.id === 'fvol') { S.vol = Number(e.target.value); e.target.style.setProperty('--v', S.vol + '%'); e.target.nextElementSibling.textContent = S.vol; }
    if (e.target.id === 'lsize') { S.lyrSize = Number(e.target.value); e.target.nextElementSibling.textContent = S.lyrSize + ' px'; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('#tmenu').hidden) { closeMenu(); return; }
      if (!$('#dialog').hidden) { $('#dialog').hidden = true; return; }
      const open = $$('.dd.open'); if (open.length) { open.forEach((d) => d.classList.remove('open')); return; }
      if (S.full) { S.full = false; render(); return; }
      if (S.qOpen) { S.qOpen = false; renderBar(); renderQueue(); return; }
    }
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (typing) return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-play], [data-jump], [role="button"][data-album]')) { e.preventDefault(); e.target.click(); return; }
    if (e.key === ' ' && e.target === document.body) { e.preventDefault(); S.playing = !S.playing; render(); }
    if (e.key === '/') { e.preventDefault(); S.page = 'search'; S.detail = null; S.full = false; render(); $('#q').focus(); }
    if (e.key === 'f' || e.key === 'F') { S.full = !S.full; render(); }
    if (/^[1-6]$/.test(e.key)) { S.page = ['home', 'search', 'explore', 'library', 'downloads', 'settings'][Number(e.key) - 1]; S.detail = null; S.full = false; render(); }
  });
  document.addEventListener('contextmenu', (e) => { const r = e.target.closest('[data-play]'); if (r && r.dataset.play) { e.preventDefault(); openMenu(r.dataset.play, e.clientX, e.clientY); } });

  applyTheme();
  render();
  window.__proto = { S, render, applyTheme, play, openMenu, snack, sleepDialog, byId };
})();

</script>
