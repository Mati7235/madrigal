<div class="md-root" style="align-items:flex-start;gap:24px">
<div class="dlg" role="dialog" aria-label="Sleep timer"><span class="ico"><svg class="ic ic-24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg></span><h3>Sleep timer</h3><p>Playback pauses after the time you pick.</p><div class="opts"><button class="md-chip md-sl">15 min</button><button class="md-chip sel md-sl"><svg class="ic ic-14" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>30 min</button><button class="md-chip md-sl">45 min</button><button class="md-chip md-sl">60 min</button><button class="md-chip md-sl">End of track</button></div><div class="acts"><button class="md-btn text md-sl">Cancel</button><button class="md-btn filled md-sl">Start</button></div></div>
