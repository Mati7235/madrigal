<div class="md-root" style="align-items:flex-start;gap:24px"><label class="tf "><span class="lbl">Playlist name</span><span class="f"><input type="text" value="Sunday morning" placeholder="" maxlength="40" aria-label="Playlist name"><button class="tr clr" type="button" aria-label="Clear Playlist name" data-clear><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span><span class="sup"><span>Shown in your library</span><span class="cnt" data-of="40">14 / 40</span></span></label><label class="tf pill lead"><span class="lbl">Search in library</span><span class="f"><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input type="text" value="" placeholder="Title, artist or album" aria-label="Search in library"><button class="tr clr" type="button" aria-label="Clear Search in library" data-clear><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span></label><label class="tf  lead"><span class="lbl">Last.fm user</span><span class="f"><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="5"/></svg><input type="text" value="" placeholder="username" aria-label="Last.fm user"><button class="tr clr" type="button" aria-label="Clear Last.fm user" data-clear><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span><span class="sup"><span>Scrobbles go to this account</span></span></label><label class="tf  lead"><span class="lbl">Download folder</span><span class="f"><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg><input type="text" value="~/Music/Madrigal" placeholder="" aria-label="Download folder"><button class="tr clr" type="button" aria-label="Clear Download folder" data-clear><svg class="ic " aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span></label><label class="tf "><span class="lbl">Crossfade</span><span class="f"><input type="text" value="6" placeholder="" aria-label="Crossfade"><span class="sfx">s</span></span><span class="sup"><span>0 to 12 seconds</span></span></label><label class="tf "><span class="lbl">API key</span><span class="f"><input type="password" value="sk-madrigal-demo" placeholder="" aria-label="API key"><button class="tr txt" type="button" data-reveal aria-pressed="false">Show</button></span><span class="sup"><span>Stored in the system keyring</span></span></label></div><script>
document.querySelectorAll('[data-clear]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const i=b.closest('.f').querySelector('input');i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));i.focus();}));
document.querySelectorAll('[data-reveal]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const i=b.closest('.f').querySelector('input');const on=i.type==='password';i.type=on?'text':'password';b.textContent=on?'Hide':'Show';b.setAttribute('aria-pressed',String(on));}));
document.querySelectorAll('.tf').forEach(t=>{const c=t.querySelector('.cnt');const i=t.querySelector('input,textarea');if(c&&i)i.addEventListener('input',()=>{c.textContent=i.value.length+' / '+c.dataset.of;});});
const CHECK=document.querySelector('template#chk')?document.querySelector('template#chk').innerHTML:'';
document.querySelectorAll('.dd').forEach(d=>{const b=d.querySelector('.trig');const set=o=>{if(o)document.querySelectorAll('.dd.open').forEach(x=>{if(x!==d){x.classList.remove('open');x.querySelector('.trig').setAttribute('aria-expanded','false');}});d.classList.toggle('open',o);b.setAttribute('aria-expanded',String(o));};
b.addEventListener('click',()=>set(!d.classList.contains('open')));
d.querySelectorAll('.mo-i').forEach(o=>o.addEventListener('click',()=>{if(o.getAttribute('aria-disabled')==='true'||o.querySelector('.sub'))return;
d.querySelectorAll('.mo-i').forEach(x=>{if(x.getAttribute('aria-selected')==='true'){x.setAttribute('aria-selected','false');x.querySelector('.lead').innerHTML='';}x.classList.remove('kb');});
o.setAttribute('aria-selected','true');o.querySelector('.lead').innerHTML=CHECK;d.querySelector('.v').textContent=o.dataset.v;b.setAttribute('aria-label',b.getAttribute('aria-label').replace(/: .*$/,': '+o.dataset.v));set(false);b.focus();}));});
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))document.querySelectorAll('.dd.open').forEach(d=>{d.classList.remove('open');d.querySelector('.trig').setAttribute('aria-expanded','false');});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dd.open').forEach(d=>{d.classList.remove('open');d.querySelector('.trig').setAttribute('aria-expanded','false');});});
</script>
